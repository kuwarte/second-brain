spring:
  application:
    name: api

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

server:
  port: ${SERVER_PORT:8080}

jwt:
  secret: ${JWT_SECRET:f50af5719c92e2e470d980ec292114cefc0cf5be493e973f5a8b98cc614091de9cc7e99400a35b6e4794ce5312eca8e8be9c7b7f399ce10621aa1042a0c19961}
  expiration-minutes: ${JWT_EXPIRATION_MINUTES:1440}

ollama:
  base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
  chat-model: ${OLLAMA_CHAT_MODEL:qwen3.5:0.8b}
  embedding-model: ${OLLAMA_EMBEDDING_MODEL:nomic-embed-text}
  connect-timeout-seconds: ${OLLAMA_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${OLLAMA_READ_TIMEOUT_SECONDS:180}

groq:
  base-url: ${GROQ_BASE_URL:https://api.groq.com/openai/v1}
  api-key: ${GROQ_API_KEY:}
  connect-timeout-seconds: ${GROQ_CONNECT_TIMEOUT_SECONDS:5}
  read-timeout-seconds: ${GROQ_READ_TIMEOUT_SECONDS:60}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    org.flywaydb: INFO
